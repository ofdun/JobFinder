server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    proxy_set_header Host $http_host;

    location /api/v1/ { proxy_pass http://backend:8080; }
    location /api/v2/ { proxy_pass http://backend:8080; }
    location /v3/api-docs { proxy_pass http://backend:8080; }

    location = /documentation { return 301 /documentation/; }
    location /documentation/ {
        index README.md;
        default_type text/plain;
        charset utf-8;
    }
    location /static/ { }
    location = /management { try_files /static/management.html =404; }

    location /admin/ {
        auth_basic "Database administration";
        auth_basic_user_file /run/secrets/admin_htpasswd;
        proxy_pass http://adminer:8080/;
        proxy_redirect / /admin/;
        proxy_cookie_path / /admin/;
    }

    location = /status { stub_status; }
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}\n';
    }
    location = /ready { proxy_pass http://backend:8080/ready; }

    location = /reserved { return 301 /reserved/; }
    location = /reserved/ { try_files /static/index.html =404; }
    location = / { try_files /static/index.html =404; }
    location / { proxy_pass http://frontend:5173; }
}
