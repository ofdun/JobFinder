components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HypermediaLink:
      type: object
      additionalProperties: false
      description: >-
        Ссылка на ресурс или действие. Тело запроса задаётся схемой соответствующей операции; наличие ссылки не отменяет
        авторизацию и проверку текущего состояния.
      required:
        - href
        - method
      properties:
        href:
          type: string
          format: uri-reference
          description: Готовый URI без шаблонов. Сервер сохраняет внешний префикс развёртывания, включая /mirror.
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
    HypermediaLinks:
      type: object
      readOnly: true
      minProperties: 1
      description: >-
        Отношение → ссылка: self, collection, vacancy, resume, update, delete, apply, applications, candidates,
        drafts, restore; для страниц — first, prev, next, last. Недоступные для текущего пользователя действия
        отсутствуют.
      additionalProperties:
        $ref: '#/components/schemas/HypermediaLink'
    UserType:
      type: string
      description: Тип учётной записи для входа и обновления токенов.
      enum: [APPLICANT, EMPLOYER]
    LoginRequest:
      type: object
      required: [email, password, userType]
      properties:
        userType:
          $ref: '#/components/schemas/UserType'
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          format: password

          minLength: 1
      additionalProperties: false
    RefreshRequest:
      type: object
      required: [refreshToken, userType]
      properties:
        userType:
          $ref: '#/components/schemas/UserType'
        refreshToken:
          type: string

          minLength: 1
      additionalProperties: false
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

      required:
        - accessToken
        - refreshToken
    Location:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        city:
          type: string
        country:
          type: string

      required:
        - id
        - city
        - country
