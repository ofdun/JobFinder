openapi: 3.1.0
info:
  title: JobFinder API
  description: |-
    API для платформы поиска работы с поддержкой векторного AI-мэтчинга резюме и вакансий.
    Контракт описывает REST API v2. Существующие адреса /api/v1 сохранены для веб-клиента.
  version: 2.0.0

servers:
  - url: /
    description: Текущий сервер API (прямое подключение или NGINX)

tags:
  - name: Auth
    description: Авторизация и аутентификация пользователей
  - name: Applicants
    description: Управление профилями соискателей
  - name: Employers
    description: Управление профилями работодателей
  - name: Vacancies
    description: Управление вакансиями
  - name: Resumes
    description: Управление резюме соискателей
  - name: Applications
    description: Отклики на вакансии
  - name: Matching
    description: AI-мэтчинг кандидатов
  - name: Categories
    description: Справочник категорий
  - name: Skills
    description: Справочник навыков
  - name: Languages
    description: Справочник языков
  - name: Locations
    description: Справочник локаций

paths:
  /api/v2/auth/login:
    post:
      tags: [Auth]
      summary: Вход пользователя
      description: Единая операция входа по email, паролю и типу пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              applicant:
                $ref: '#/components/examples/LoginRequest'
              employer:
                $ref: '#/components/examples/EmployerLoginRequest'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

              examples:
                default:
                  $ref: '#/components/examples/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postAuthLogin
      security: []
  /api/v2/auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление токенов пользователя
      description: Тип пользователя должен соответствовать владельцу refreshToken; несовпадение даёт 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              applicant:
                $ref: '#/components/examples/RefreshRequest'
              employer:
                $ref: '#/components/examples/EmployerRefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'

              examples:
                default:
                  $ref: '#/components/examples/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postAuthRefresh
      security: []
  /api/v2/categories:
    get:
      tags: [Categories]
      summary: Получить список всех категорий
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

              example:
                - id: 1
                  name: Разработка
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getCategories
      security: []
  /api/v2/skills:
    get:
      tags: [Skills]
      summary: Получить список всех навыков
      responses:
        '200':
          description: Список навыков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'

              example:
                - id: 1
                  name: Java
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getSkills
      security: []
  /api/v2/languages:
    get:
      tags: [Languages]
      summary: Получить список всех языков
      responses:
        '200':
          description: Список языков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'

              example:
                - id: 1
                  name: English
                  proficiencyLevel: B2
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getLanguages
      security: []
  /api/v2/locations/{id}:
    get:
      tags: [Locations]
      summary: Получить локацию по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Локация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'

              examples:
                default:
                  $ref: '#/components/examples/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getLocationsId
      security: []
  /api/v2/locations:
    get:
      tags: [Locations]
      summary: Поиск локаций по городу или стране
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Найденные локации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'

              example:
                - id: 1
                  city: Москва
                  country: Россия
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getLocations
      security: []
  /api/v2/applicants:
    post:
      tags: [Applicants]
      summary: Регистрация нового соискателя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantRequest'
            examples:
              default:
                $ref: '#/components/examples/ApplicantRequest'
      responses:
        '201':
          description: Соискатель создан
          content:
            application/json:
              schema:
                type: integer
                format: int64
                minimum: 1
                description: ID созданного соискателя
                examples: [1]
              examples:
                createdApplicantId:
                  summary: ID созданного соискателя
                  value: 1
          headers:
            Location:
              description: URI созданного ресурса
              schema:
                type: string
                format: uri-reference
              example: /api/v2/applicants/1
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postApplicants
      security: []
  /api/v2/applicants/{id}:
    get:
      tags: [Applicants]
      summary: Получить профиль соискателя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Профиль соискателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applicant'
              examples:
                default:
                  $ref: '#/components/examples/Applicant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getApplicantsId
      description: Доступно только владельцу профиля.
    put:
      tags: [Applicants]
      summary: Обновить профиль соискателя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantUpdateRequest'
            examples:
              default:
                $ref: '#/components/examples/ApplicantUpdateRequest'
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applicant'
              examples:
                default:
                  $ref: '#/components/examples/Applicant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: putApplicantsId
      description: Доступно только владельцу профиля.
    delete:
      tags: [Applicants]
      summary: Удалить профиль соискателя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Профиль успешно удален

        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: deleteApplicantsId
      description: Доступно только владельцу профиля.
  /api/v2/employers:
    post:
      tags: [Employers]
      summary: Регистрация нового работодателя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerRequest'
            examples:
              default:
                $ref: '#/components/examples/EmployerRequest'
      responses:
        '201':
          description: Работодатель создан
          content:
            application/json:
              schema:
                type: integer

              example: 1
          headers:
            Location:
              description: URI созданного ресурса
              schema:
                type: string
                format: uri-reference
              example: /api/v2/employers/1
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postEmployers
      security: []
  /api/v2/employers/{id}:
    get:
      tags: [Employers]
      summary: Получить профиль работодателя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Профиль работодателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employer'
              examples:
                default:
                  $ref: '#/components/examples/Employer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getEmployersId
      description: Доступно только владельцу профиля.
    put:
      tags: [Employers]
      summary: Обновить профиль работодателя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerUpdateRequest'
            examples:
              default:
                $ref: '#/components/examples/EmployerUpdateRequest'
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employer'
              examples:
                default:
                  $ref: '#/components/examples/Employer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: putEmployersId
      description: Доступно только владельцу профиля.
    delete:
      tags: [Employers]
      summary: Удалить профиль работодателя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Профиль успешно удален

        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: deleteEmployersId
      description: Доступно только владельцу профиля.
  /api/v2/vacancies:
    get:
      tags: [Vacancies]
      summary: Поиск вакансий по фильтрам с пагинацией
      description: Параметры limit/offset/sortBy/sortDesc соответствуют модели OffsetPaginationParams.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Подстрока для поиска по описанию вакансии
        - name: employerId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: locationId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: salaryMin
          in: query
          required: false
          schema:
            type: number
        - name: salaryMax
          in: query
          required: false
          schema:
            type: number
        - name: paymentFrequency
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentFrequency'
        - name: employmentType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EmploymentType'
        - name: workFormat
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JobFormat'
        - name: publicationDateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: publicationDateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: skillIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
          description: Фильтр по навыкам (AND). Вакансия должна содержать ВСЕ переданные skillIds.
        - name: languageIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
          description: Фильтр по языкам (AND). Вакансия должна содержать ВСЕ переданные languageIds.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
            maximum: 100
          description: Количество элементов на странице
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Смещение от начала выборки
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - publicationDate
              - salary
              - id
          description: Поле сортировки (например publicationDate)
        - name: sortDesc
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Сортировка по убыванию
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VacancyStatus'
          description: Состояние публикации вакансии.
      responses:
        '200':
          description: Страница вакансий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyPageResponse'

              examples:
                default:
                  $ref: '#/components/examples/VacancyPageResponse'
                middlePage:
                  $ref: '#/components/examples/VacancyPageMiddle'
                emptyPage:
                  $ref: '#/components/examples/VacancyPageEmpty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
      operationId: getVacancies
      security: []
    post:
      tags: [Vacancies]
      summary: Создать вакансию
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyRequest'
            examples:
              default:
                $ref: '#/components/examples/VacancyRequest'
      responses:
        '201':
          description: Вакансия создана
          content:
            application/json:
              schema:
                type: integer

              example: 1
          headers:
            Location:
              description: URI созданного ресурса
              schema:
                type: string
                format: uri-reference
              example: /api/v2/vacancies/1
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postVacancies
      description: Доступно работодателю-владельцу вакансии.
  /api/v2/vacancies/{id}:
    get:
      tags: [Vacancies]
      summary: Получить вакансию по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Данные вакансии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
              examples:
                default:
                  $ref: '#/components/examples/Vacancy'
                applicant:
                  $ref: '#/components/examples/VacancyForApplicant'
                owner:
                  $ref: '#/components/examples/VacancyForOwner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getVacanciesId
      security: []
    put:
      tags: [Vacancies]
      summary: Обновить вакансию
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancyRequest'
            examples:
              default:
                $ref: '#/components/examples/VacancyRequest'
      responses:
        '200':
          description: Вакансия обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
              examples:
                default:
                  $ref: '#/components/examples/Vacancy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: putVacanciesId
      description: Доступно работодателю-владельцу вакансии.
    delete:
      tags: [Vacancies]
      summary: Удалить вакансию
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Вакансия удалена

        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: deleteVacanciesId
      description: Доступно работодателю-владельцу вакансии.
  /api/v2/resumes:
    get:
      tags: [Resumes]
      summary: Поиск резюме по фильтрам с пагинацией
      description: Параметры limit/offset/sortBy/sortDesc соответствуют модели OffsetPaginationParams.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Подстрока для поиска по описанию резюме
        - name: applicantId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: creationDateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: creationDateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: skillIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
          description: Фильтр по навыкам (AND). Резюме должно содержать ВСЕ переданные skillIds.
        - name: languageIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
          description: Фильтр по языкам (AND). Резюме должно содержать ВСЕ переданные languageIds.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sortBy
          in: query
