apiVersion: 1
datasources:
- name: Tempo
  uid: tempo
  type: tempo
  access: proxy
  url: http://tempo:3200
  editable: false
  jsonData:
    httpMethod: GET
    nodeGraph:
      enabled: true
    tracesToLogsV2:
      datasourceUid: loki
      spanStartTimeShift: '-5s'
      spanEndTimeShift: '5s'
      filterByTraceID: false
      filterBySpanID: false
      customQuery: true
      query: '{service_name="JobFinder"} | json | traceId = "$${__span.traceId}"'
