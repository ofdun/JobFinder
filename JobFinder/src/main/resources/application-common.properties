spring.application.name=JobFinder
app.auth.encryption-key=${AUTH_ENCRYPTION_KEY:}
app.auth.attempt-limit=5
app.auth.lockout-seconds=900
app.auth.password-max-age-days=90
app.auth.challenge-seconds=300
app.ollama.model=mxbai-embed-large
app.ollama.url=http://ollama:11434
app.ollama.endpoint=/api/embed
app.qdrant.base=qdrant
app.qdrant.grpc-port=6334
app.qdrant.rest-port=6333
app.qdrant.use-tls=false
app.qdrant.collection-name=job-finder
app.qdrant.embedding-dimension=1024
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=3600000
app.jwt.refresh-expiration=604800000
logging.file.name=logs/jobfinder.log

# Swagger UI reads the authoritative contract, using only local assets.
springdoc.swagger-ui.path=/api/v2/docs
springdoc.swagger-ui.url=/api/v2/openapi.yml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=
springdoc.api-docs.version=OPENAPI_3_1

management.tracing.export.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.schedule-delay=1s
management.otlp.metrics.export.enabled=false
