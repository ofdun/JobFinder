name: Publish report

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      kind:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.report_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: config
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: .ci-publish
      - name: Подготовить сайт, сохранив опубликованные отчёты
        id: site
        env:
          REPORT_KIND: ${{ inputs.kind }}
          PAGES_URL: ${{ steps.config.outputs.base_url }}
        run: python3 ci/publish.py --input .ci-publish --output .ci-pages --kind "$REPORT_KIND" --base-url "$PAGES_URL"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .ci-pages
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Ссылка на опубликованный отчёт
        env:
          REPORT_URL: ${{ steps.site.outputs.report_url }}
        run: printf '[Открыть HTML-отчёт](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
