name: Test dashboard

on:
  push:
    branches: [testing/lab2]
    paths:
      - ci/dashboard.html
      - ci/report.py
      - ci/history.py
      - ci/publish.py
      - .github/workflows/dashboard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: python3 ci/history.py --history .ci-history/history.json
      - name: Render recorded results without adding a test run
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'ci')
          from report import render_dashboard
          render_dashboard(Path('.ci-report'), json.loads(Path('.ci-history/history.json').read_text()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-report
          path: .ci-report/
          include-hidden-files: true
          retention-days: 14

  pages:
    needs: report
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-report.yml
    with:
      artifact: dashboard-report
      kind: tests
