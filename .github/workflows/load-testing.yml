name: Load testing
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Load smoke · PR #{0}', github.event.pull_request.number) || format('Load testing · {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      profile:
        description: Сценарий нагрузки
        type: choice
        default: all
        options: [all, ramp, stress, soak, soak-10, soak-20]
      smoke:
        description: Короткая проверка стенда вместо полного измерения
        type: boolean
        default: false
      peak_vus:
        description: Пиковые пользователи для ramp/stress (5–1024; smoke — максимум 8)
        type: number
        default: 128
      soak_seconds:
        description: Длительность каждого soak без прогрева, секунды
        type: choice
        default: '600'
        options: ['600', '1800', '3600']
      recovery_seconds:
        description: Наблюдение восстановления после перегрузки, секунды
        type: choice
        default: '600'
        options: ['600', '900', '1800']

permissions:
  contents: read

concurrency:
  group: load-testing-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  load:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'load-test')
    name: ${{ github.event_name == 'pull_request' && 'Load smoke + report' || 'Load testing + report' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 330 }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка расчётов статистики
        run: python3 -m unittest discover -s load-testing -p 'test_*.py'

      - name: Поднять стенд и выполнить нагрузочное тестирование
        timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 300 }}
        env:
          LOAD_PROFILE: ${{ inputs.profile || 'all' }}
          LOAD_SMOKE: ${{ github.event_name == 'pull_request' || inputs.smoke }}
          LOAD_PEAK_VUS: ${{ inputs.peak_vus || 128 }}
          LOAD_SOAK_SECONDS: ${{ inputs.soak_seconds || '600' }}
          LOAD_RECOVERY_SECONDS: ${{ inputs.recovery_seconds || '600' }}
        shell: bash
        run: |
          args=(
            --profile "$LOAD_PROFILE"
            --peak-vus "$LOAD_PEAK_VUS"
            --soak-seconds "$LOAD_SOAK_SECONDS"
            --recovery-seconds "$LOAD_RECOVERY_SECONDS"
            --stable-vus 4
            --application-cpus '0,1'
            --generator-cpus 2
            --monitor-cpus 3
          )
          if [[ "$LOAD_SMOKE" == "true" ]]; then
            args+=(--smoke)
          fi
          python3 -u load-testing/run.py "${args[@]}"

      - name: Сохранить отчёты, измерения и логи
        id: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-testing-${{ github.run_id }}-${{ github.run_attempt }}
          path: load-testing/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Ссылка на результаты
        if: always()
        env:
          RESULTS_URL: ${{ steps.results.outputs.artifact-url }}
        shell: bash
        run: |
          if [[ -n "$RESULTS_URL" ]]; then
            {
              printf '### Нагрузочное тестирование\n\n'
              printf '[Скачать отчёты и логи](%s)\n\n' "$RESULTS_URL"
              printf 'Распакуйте архив и откройте index.html в папке запуска.\n\n'
              printf 'Зелёный статус означает завершение измерений, а не соблюдение SLO. Превышения порогов, ошибки и восстановление показаны в отчёте.\n\n'
              printf 'Постоянная нагрузка: 4 пользователя. CPU: приложение — 0,1; генератор — 2; мониторинг — 3. Результаты этого стенда не следует напрямую сравнивать с локальными.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path('load-testing/results').glob('*/*/summary.json')):
              result = json.loads(path.read_text())
              latency = result.get('latency_ms')
              p95 = f"{latency['percentiles']['0.95']:.2f}" if latency else '—'
              rows.append(f"| {result['profile']} | {'SMOKE' if result['smoke'] else 'Полный'} | {result['requests']} | {p95} | {result['rps']['mean']:.2f} | {result['unexpected_errors']} |")
          if rows:
              print('\n| Сценарий | Режим | Запросы | p95, мс | RPS | Неожиданные ошибки |')
              print('|---|---|---:|---:|---:|---:|')
              print('\n'.join(rows))
              print('\nSMOKE проверяет работоспособность стенда и не заменяет полное нагрузочное исследование.')
          PY
