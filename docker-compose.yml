include:
- ./observability/compose.yml

services:
  ollama:
    build: ./docker/ollama
    container_name: jobfinder-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334

  postgres:
    image: postgres:15
    container_name: jobfinder-postgres
    environment:
      POSTGRES_DB: jobfinder
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: jobfinder
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8.6
    container_name: jobfinder-redis
    ports:
      - "6379:6379"

  backend:
    image: gradle:9.1-jdk25
    container_name: jobfinder-backend
    restart: unless-stopped
    working_dir: /workspace/JobFinder
    environment:
      GRADLE_USER_HOME: /home/gradle/.gradle
      SPRING_DATA_REDIS_HOST: redis
      TRACING_ENABLED: 'true'
      TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      LOGGING_LEVEL_COM_OFDUN_JOBFINDER_COMMON_LOGGING: DEBUG
    command: sh -c "chmod +x ./gradlew && ./gradlew bootRun --no-daemon"
    env_file:
      - ./JobFinder/.env
    depends_on:
      - postgres
      - redis
      - qdrant
      - ollama
      - mongodb
      - otel-collector
    ports:
      - "8080:8080"
    volumes:
      - ./JobFinder:/workspace/JobFinder
      - ./docs:/workspace/docs:ro
      - ./ci:/workspace/ci:ro
      - gradle_cache:/home/gradle/.gradle
      - backend_logs:/workspace/JobFinder/logs

  frontend:
    image: node:22
    container_name: jobfinder-frontend
    working_dir: /workspace/JobFinder-front
    environment:
      VITE_PROXY_TARGET: http://jobfinder-backend:8080
      VITE_BASE_PATH: /legacy/
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./JobFinder-front:/workspace/JobFinder-front
      - frontend_node_modules:/workspace/JobFinder-front/node_modules

  adminer:
    image: adminer:6.0.1-standalone
    container_name: jobfinder-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  gateway:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: project-gateway
    container_name: jobfinder-gateway
    restart: unless-stopped
    ports:
      - 127.0.0.1:${JOBFINDER_HTTP_PORT:-8088}:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/static/management.html:/usr/share/nginx/html/static/management.html:ro
    secrets:
      - admin_htpasswd
    depends_on:
      - backend
      - frontend
      - adminer
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 10s
      timeout: 3s
      retries: 3

secrets:
  admin_htpasswd:
    file: ./.local/gateway/admin.htpasswd

volumes:
  mongodb_data:
  ollama_data:
  qdrant_data:
  postgres_data:
  gradle_cache:
  backend_logs:
  frontend_node_modules:
